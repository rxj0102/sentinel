name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: make lint
      - run: make typecheck
      - run: make test
      - name: Offline end to end on the synthetic fixture
        run: make quality
      - name: Upload quality report
        uses: actions/upload-artifact@v4
        with:
          name: data-quality
          path: results/synthetic
