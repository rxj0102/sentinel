[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinel"
version = "0.1.0"
description = "Behavioral alpha and risk platform built on free data"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "pandera>=0.20",
  "pydantic>=2.6",
  "pyyaml>=6",
  "typer>=0.12",
  "structlog>=24",
  "requests>=2.31",
]

[project.optional-dependencies]
live = ["yfinance>=0.2.40", "lxml>=5"]
dev = [
  "pytest>=8", "pytest-cov>=5", "hypothesis>=6.100",
  "ruff>=0.5", "black>=24", "mypy>=1.10",
  "pandas-stubs", "types-PyYAML", "types-requests",
]

[project.scripts]
sentinel = "sentinel.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/sentinel"]

[[tool.mypy.overrides]]
module = ["yfinance.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["live: needs network, never run in CI"]

[tool.coverage.run]
source = ["src/sentinel"]
omit = ["src/sentinel/data/sources/fetch.py"]

[tool.coverage.report]
fail_under = 85
